[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overflow-trace"
version = "1.0.2"
description = "Mobile viewport horizontal overflow and layout breakage tracer via Chromium CDP"
readme = "README.md"
authors = [
  { name = "xcalibur73" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    # PolyForm Noncommercial 1.0.0
    "License :: Free For Educational Use",
    "License :: Free For Non-commercial Use",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing"
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "websockets>=12.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
overflow-trace = "overflow_trace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["overflow_trace*"]
exclude = ["assets*", "tests*"]

[project.urls]
"Homepage" = "https://github.com/xcalibur73/overflow-trace"
"Cloud Engine" = "https://webaudits.pro/tools/overflow-trace"
"Bug Tracker" = "https://github.com/xcalibur73/overflow-trace/issues"
